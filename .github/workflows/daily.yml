name: AP Army Daily Pipeline

# -----------------------------------------------------------------------
# Triggers
# -----------------------------------------------------------------------
on:
  schedule:
    # 01:00 UTC = 08:00 WIB (Jakarta) — ops team starts work at 08:00
    - cron: '0 1 * * *'

  # Manual trigger with optional overrides (useful for debugging)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — crawl and score but skip Sheets writes'
        type: boolean
        default: false
      platform:
        description: 'Platform to crawl (leave blank for all)'
        type: string
        default: ''
      ref:
        description: 'Branch or tag to run (default: main)'
        type: string
        default: 'main'

# Only one pipeline run at a time — cancel any in-progress run if a new
# one starts (prevents stale crawl data racing with a fresh run).
concurrency:
  group: ap-army-pipeline
  cancel-in-progress: true

# -----------------------------------------------------------------------
# Jobs
# -----------------------------------------------------------------------
jobs:
  pipeline:
    name: Daily detection run
    runs-on: ubuntu-latest
    timeout-minutes: 90       # hard ceiling — hung Playwright shouldn't block forever

    # Permissions: read-only for code, no extra permissions needed
    permissions:
      contents: read

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ----------------------------------------------------------------
      # 2. Python setup with pip cache
      # ----------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ----------------------------------------------------------------
      # 3. Install Python dependencies
      # ----------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 4. Install Playwright browser (Chromium only — smallest download)
      # ----------------------------------------------------------------
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ----------------------------------------------------------------
      # 5. Write secrets to files
      #
      # Credentials are stored as GitHub Secrets (JSON blobs) and written
      # to disk only for the duration of this job. The daily.sh cleanup
      # trap removes these files at the end of the run.
      #
      # Google auth uses OAuth installed-app flow:
      #   GOOGLE_OAUTH_CLIENT_JSON   — OAuth client credential (oauth_client.json)
      #   GOOGLE_AUTHORIZED_USER_JSON — saved refresh token (authorized_user.json)
      #     generated once locally via: python -c "import gspread; gspread.oauth(...)"
      # ----------------------------------------------------------------
      - name: Write Google OAuth credentials
        env:
          OAUTH_CLIENT_JSON:    ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON }}
        run: |
          echo "$OAUTH_CLIENT_JSON"    > oauth_client.json
          echo "$AUTHORIZED_USER_JSON" > authorized_user.json

      - name: Write Facebook cookie file
        env:
          FB_COOKIE_JSON: ${{ secrets.FB_COOKIE_JSON }}
        run: echo "$FB_COOKIE_JSON" > fb_cookies.json

      # ----------------------------------------------------------------
      # 6. Run the pipeline
      # ----------------------------------------------------------------
      - name: Run daily pipeline
        env:
          # --- Google Sheets ---
          GOOGLE_SHEETS_ID:        ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT:  oauth_client.json
          GOOGLE_AUTHORIZED_USER:  authorized_user.json

          # --- Facebook crawler ---
          FB_COOKIE_FILE: fb_cookies.json

          # --- Alerts (Google Chat) ---
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}

          # --- Runtime config ---
          ENABLED_PLATFORMS: ${{ github.event.inputs.platform || 'facebook,bilibili' }}

          # CI=true tells daily.sh to wipe credential files after the run
          CI: 'true'

        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          PLATFORM_FLAG=""
          if [ -n "${{ github.event.inputs.platform }}" ]; then
            PLATFORM_FLAG="--platform ${{ github.event.inputs.platform }}"
          fi

          bash daily.sh $DRY_RUN_FLAG $PLATFORM_FLAG

      # ----------------------------------------------------------------
      # 7. Upload logs as artifacts (always, so failures are debuggable)
      # ----------------------------------------------------------------
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            logs/
            stats/
          retention-days: 30
          if-no-files-found: warn

      # ----------------------------------------------------------------
      # 8. Security: wipe all credential files (belt-and-suspenders)
      # ----------------------------------------------------------------
      - name: Remove credential files
        if: always()
        run: |
          rm -f oauth_client.json authorized_user.json fb_cookies.json
          echo "Credential files removed."
